[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtr"
version = "0.1.0"
description = "Python client SDK for the Distributed Training Data & Checkpoint Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DTR contributors" }]
dependencies = [
  "grpcio>=1.60",
  "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "mypy>=1.10",
  "grpcio-tools>=1.60",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/dtr/_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = "_proto"

[tool.pytest.ini_options]
testpaths = ["tests"]
